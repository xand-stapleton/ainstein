###############################################################################
# Sphere hyperparameters
#
# Standard section order:
# model, geometry, data, loss, finiteness, training, logging, model_specific,
# visualisation, metadata.
###############################################################################

###############################################################################
# Model
model:
  experiment: sphere

  # Load a saved model instead of creating a new one.
  saved_model: true
  saved_model_path: seed_models/I_2d2p.keras
  saved_model_weight_noise: 0.0

  # Network definition. When saved_model is true, these are restored from the
  # saved model where the loader requires architectural consistency.
  dtype: float64
  n_hidden: 128
  n_layers: 4
  activations: gelu
  use_bias: true

  # Random seeds. Null lets the runner create and record seeds.
  np_seed: null
  tf_seed: null

###############################################################################
# Geometry
geometry:
  # Manifold dimension and atlas size.
  dim: 2
  n_patches: 2

  # Einstein equation convention: Ric_ij = lambda * g_ij.
  einstein_constant: 1.0

  # Distance from the radial midpoint to the outer edge of the overlap region.
  overlap_upperwidth: 0.1

###############################################################################
# Data
data:
  # Patch radius for ball samples or width for cube samples.
  patch_width: 1.0

  # Number of training samples generated per refresh.
  num_samples: 10000

###############################################################################
# Loss
loss:
  # Base loss multipliers.
  einstein_multiplier: 1.0
  overlap_multiplier: 10.0
  finiteness_multiplier: 1.0

  # Loss schedules. Null keeps each multiplier fixed at its base value.
  einstein_schedule: null
  overlap_schedule: null
  finiteness_schedule: null
  kretschmann_schedule: null
  r2_det_schedule: null
  killing_symmetry_schedule: null
  k_repeller_schedule: null
  speciality_index_rprofile_schedule: null
  horizon_anchor_schedule: null
  trapped_surface_schedule: null

###############################################################################
# Finiteness
finiteness:
  # Soft well parameters for penalising metric components outside a finite band.
  finite_centre: 25
  finite_width: 25
  finite_sharpness: 20
  finite_height: 1000
  finite_slope: 0.2

###############################################################################
# Training
training:
  epochs: 100
  batch_size: 100

  # Polynomial learning-rate decay endpoint.
  init_learning_rate: 0.005
  min_learning_rate: 0.0005

  # Validation sample and reporting controls.
  use_validation: true
  val_print: false
  num_val_samples: 500
  val_batch_size: 100

  # Epoch logging cadence; 0 disables progress messages.
  verbosity: 1

###############################################################################
# Logging
logging:
  log_wandb: true
  wandb_log_freq: 10

  # File logging. Null log_interval keeps best-model logging only.
  log_interim: true
  log_dir: runs
  log_interval: null
  track_best: true
  save_best_hist: false
  log_errors: true
  print_batch_losses: false

###############################################################################
# Model-specific
model_specific:
  # Ball sampling is the supported sphere path; cube sampling is limited.
  ball: true

  # Beta sampling shape: < 1 skews toward boundaries, > 1 toward the midpoint.
  density_power: 4.0

  # Signature flag for analytic/loss paths.
  lorentzian: false

###############################################################################
# Visualisation
visualisation:
  visualise: true

###############################################################################
# Metadata
metadata:
  run_name: sphere
  run_id: null
  misc: {}
