###############################################################################
# Schwarzschild search hyperparameters
###############################################################################

###############################################################################
# Model
model:
  experiment: blackhole

  # Coarse 5D-ambient SchwarzschildGlobalModel seed. This config uses a staged
  # continuation because the seed is not a polished unsupervised solution.
  saved_model: true
  saved_model_path: seed_models/IL_embed.keras
  saved_model_weight_noise: 0.0

  dtype: float64
  n_hidden: 128
  n_layers: 4
  activations: gelu
  use_bias: true

  np_seed: null
  tf_seed: null

###############################################################################
# Geometry
geometry:
  dim: 4
  n_patches: 1
  einstein_constant: 0.0

###############################################################################
# Data
data:
  num_samples: 10000

###############################################################################
# Loss
loss:
  einstein_multiplier: 0.35

  # Loss schedules. Null keeps each multiplier fixed at its base value.
  einstein_schedule: null
  kretschmann_schedule: null
  r2_det_schedule: null
  killing_symmetry_schedule: null
  k_repeller_schedule: null
  speciality_index_rprofile_schedule: null
  horizon_anchor_schedule: null
  trapped_surface_schedule: null

###############################################################################
# Training stages
#
# Stage 1 is the global geometric fit. Stage 2 changes sampling and learning
# rate to polish interior behaviour without replacing the stage-1 solution.
training_stages:
  - name: global_geometric_fit
    epochs: 300
    init_learning_rate: 0.0003
    min_learning_rate: 0.000003

  - name: interior_visual_polish
    epochs: 50
    init_learning_rate: 0.000006
    min_learning_rate: 0.000001

    einstein_multiplier: 6.0
    einstein_schedule: null

    kretschmann_multiplier: 6.0
    kretschmann_schedule: null

    r2_det_loss_multiplier: 0.01
    r2_det_schedule: null

    killing_symmetry_multiplier: 1.5
    killing_symmetry_schedule: null

    use_volume_scaling: true
    use_metric_contraction: true
    volume_scaling_loss_components:
      einstein: true
      kretschmann: true
      r2_det: true
      killing_symmetry: true
      k_repeller: true
      speciality_index_rprofile: true
    metric_contraction_loss_components:
      einstein: true
      kretschmann: false
      r2_det: false
      killing_symmetry: true
      k_repeller: false
      speciality_index_rprofile: true

    patch_width_R2: 0.85
    density_power_R2: 0.25
    density_power_R2_schedule: null

    use_penrose_region_curriculum: true
    penrose_interior_only: true
    penrose_region_exterior_start: 0.0
    penrose_region_interior_start: 0.65
    penrose_region_horizon_start: 0.0
    penrose_region_singularity_start: 0.35
    penrose_region_exterior_end: 0.0
    penrose_region_interior_end: 0.55
    penrose_region_horizon_end: 0.0
    penrose_region_singularity_end: 0.45
    penrose_region_horizon_width: 0.06
    penrose_region_singularity_width: 0.14

###############################################################################
# Training
training:
  epochs: 10
  batch_size: 25

  init_learning_rate: 0.0003
  min_learning_rate: 0.000003

  use_validation: true
  val_print: false
  num_val_samples: 200
  val_batch_size: 100

  verbosity: 1

###############################################################################
# Logging
logging:
  log_wandb: false
  wandb_log_freq: 10

  log_interim: true
  log_dir: runs
  log_interval: null
  track_best: true
  save_best_hist: false
  log_errors: true
  print_batch_losses: false

###############################################################################
# Model-specific
model_specific:
  # Signature and architecture.
  lorentzian: true
  embed: true
  m: 1.0

  # Penrose R2 and stereographic S2 sampling controls.
  patch_width_R2: 0.85
  patch_width_S2: 1.0
  density_power_R2: 1.1
  density_power_S2: 1.0
  density_power_R2_schedule: null
  density_power_S2_schedule: null

  # Curriculum shifts attention toward black/white-hole interior bands.
  use_penrose_region_curriculum: true
  penrose_interior_only: false
  penrose_region_exterior_start: 0.45
  penrose_region_interior_start: 0.30
  penrose_region_horizon_start: 0.20
  penrose_region_singularity_start: 0.05
  penrose_region_exterior_end: 0.20
  penrose_region_interior_end: 0.45
  penrose_region_horizon_end: 0.15
  penrose_region_singularity_end: 0.20
  penrose_region_horizon_width: 0.06
  penrose_region_singularity_width: 0.10

  # Schwarzschild embedding loss terms.
  kretschmann_multiplier: 3.5
  r2_det_loss_multiplier: 0.075
  killing_symmetry_multiplier: 1.0
  k_repeller_multiplier: 0.0
  speciality_index_rprofile_multiplier: 0.0

  # Loss norm conventions.
  use_volume_scaling: true
  use_metric_contraction: true
  volume_scaling_loss_components:
    einstein: true
    kretschmann: true
    r2_det: true
    killing_symmetry: true
    k_repeller: true
    speciality_index_rprofile: true
  metric_contraction_loss_components:
    einstein: true
    kretschmann: false
    r2_det: false
    killing_symmetry: true
    k_repeller: false
    speciality_index_rprofile: true

  # Ricci/Kretschmann kernel: standard reverse-mode or optimised forward-mode.
  ricci_kernel: optimised

###############################################################################
# Visualisation
visualisation:
  visualise: true
  num_samples: 1000
  patch_width_R2: 0.8
  patch_width_S2: 1.0
  density_power_R2: 0.8
  density_power_S2: 1.0
  local_single_s2_patch: null
  local_s2_patch_idx: null

###############################################################################
# Metadata
metadata:
  run_name: blackhole
  run_id: null
  misc: {}
