###############################################################################
# Model set-up
model:
  # Experiment name
  experiment: schwarzschild

  # Import a saved model instead of initiating a new one (null means randomly initialise)
  # IL_embed.keras is a coarse 5D-ambient SchwarzschildGlobalModel seed. It is
  # further from the final unsupervised solution than the va* polished runs, so
  # this config uses a longer, staged continuation.
  saved_model: true
  saved_model_path: seed_models/IL_embed.keras
  # ...the below are ignored if `saved_model` is true and a model is imported

  # Floating-point dtype (float64 for physics accuracy; float32 to use GPU on macOS)
  dtype: float64

  # Number of hidden units in each layer
  n_hidden: 128

  # Number of layers in the neural network
  n_layers: 4

  # Activation function to use in the neural network (e.g., gelu, relu)
  activations: gelu

  # Whether to use bias terms in the neural network layers
  use_bias: true

  # Seeds
  np_seed: null
  tf_seed: null

###############################################################################
# Geometric set-up
geometry:
  # Dimensionality of the manifold
  dim: 4

  # Set the number of patches (1 = global embedding, no overlap)
  n_patches: 1

  # Einstein constant, $\lambda$, in Einstein eqn: $R_{ij} = \lambda g_{ij}$
  einstein_constant: 0.0

  # Patching size
  # ...determines the distance from the radial midpoint to the outer edge of the 
  # overlap region within the stereographic patches
  overlap_upperwidth: 0.1

###############################################################################
# Data set-up
data:
  # Number of samples to generate for training
  num_samples: 100

###############################################################################
# Loss set-up
loss:
  # Multiplier values for the loss contributions
  # overlap and finiteness losses are not used in the embedding architecture
  einstein_multiplier: 0.35
  overlap_multiplier: 0.0
  finiteness_multiplier: 0.0
  
  # Optional multiplier scheduling (null = no scheduling)
  # Supported strategies: constant, linear, exponential, cosine, step
  # 
  # See network/schedulers.py::FloatScheduler for full documentation
  # Start by fitting the curvature scale, then hand control to the
  # positive-definite Einstein norm.
  einstein_schedule:
    strategy: cosine
    final_value: 4.0
    warmup_epochs: 0
    decay_rate: 0.96
    steps: 1
  kretschmann_schedule:
    strategy: cosine
    final_value: 1.25
    warmup_epochs: 0
    decay_rate: 0.96
    steps: 1
  # Keep the determinant barrier active throughout.  The positive Einstein norm
  # fixed the Ricci-scale issue, but honest-paper collapsed toward a degenerate
  # R2 block once this term dropped to ~0.
  r2_det_schedule:
    strategy: cosine
    final_value: 0.005
    warmup_epochs: 0
    decay_rate: 0.96
    steps: 1
  speciality_index_schedule: null
  killing_symmetry_schedule:
    strategy: cosine
    final_value: 2.5
    warmup_epochs: 0
    decay_rate: 0.96
    steps: 1
  k_repeller_schedule: null
  speciality_index_rprofile_schedule: null
  overlap_schedule: null
  finiteness_schedule: null

###############################################################################
# Finiteness filter hyperparameters
finiteness:
  # Centre of the minimum
  finite_centre: 140
  # Width of the minimum
  finite_width: 160 
  # Sharpness of the curve at the boundary of the minimum region
  finite_sharpness: 8 
  # Height of the "walls" around the minimum
  finite_height: 100 
  # Slope of the lines which start at the top of the "walls"
  finite_slope: 0.2 

###############################################################################
# Training set-up
training:
  # Number of training epochs
  epochs: 10

  # Batch size for training
  batch_size: 25

  # Learning rate for the optimizer
  init_learning_rate: 0.0003
  min_learning_rate: 0.000003

  # Validation hyperparameters
  use_validation: true
  val_print: false
  num_val_samples: 200
  val_batch_size: 100

  # Verbosity level for print logging (e.g., 0 for silent, 1 for progress messages)
  verbosity: 1

###############################################################################
# Staged training
#
# Stage 1 is the global geometric fit. Stage 2 keeps the same geometric loss
# convention and only changes sampling/LR so it polishes black-hole and
# white-hole near-singularity behaviour without overwriting the stage-1 solution.
training_stages:
  - name: global_geometric_fit
    epochs: 300
    init_learning_rate: 0.0003
    min_learning_rate: 0.000003

  - name: interior_visual_polish
    epochs: 50
    init_learning_rate: 0.000006
    min_learning_rate: 0.000001

    einstein_multiplier: 6.0
    einstein_schedule:
      strategy: constant
      final_value: 6.0
      warmup_epochs: 0
      decay_rate: 0.96
      steps: 1
    kretschmann_multiplier: 6.0
    kretschmann_schedule:
      strategy: constant
      final_value: 6.0
      warmup_epochs: 0
      decay_rate: 0.96
      steps: 1
    r2_det_loss_multiplier: 0.01
    r2_det_schedule:
      strategy: constant
      final_value: 0.01
      warmup_epochs: 0
      decay_rate: 0.96
      steps: 1
    killing_symmetry_multiplier: 1.5
    killing_symmetry_schedule:
      strategy: constant
      final_value: 1.5
      warmup_epochs: 0
      decay_rate: 0.96
      steps: 1

    use_volume_scaling: true
    use_area_measure_weight: true
    use_metric_contraction: true
    volume_scaling_loss_components:
      einstein: true
      kretschmann: true
      r2_det: true
      speciality_index: true
      killing_symmetry: true
      k_repeller: true
      speciality_index_rprofile: true
    metric_contraction_loss_components:
      einstein: true
      kretschmann: false
      r2_det: false
      speciality_index: false
      killing_symmetry: true
      k_repeller: false
      speciality_index_rprofile: true

    patch_width_R2: 0.85
    density_power_R2: 0.25
    density_power_R2_schedule:
      strategy: constant
      final_value: 0.25
      warmup_epochs: 0
      decay_rate: 0.96
      steps: 1

    use_penrose_region_curriculum: true
    penrose_interior_only: true
    penrose_region_exterior_start: 0.0
    penrose_region_interior_start: 0.65
    penrose_region_horizon_start: 0.0
    penrose_region_singularity_start: 0.35
    penrose_region_exterior_end: 0.0
    penrose_region_interior_end: 0.55
    penrose_region_horizon_end: 0.0
    penrose_region_singularity_end: 0.45
    penrose_region_horizon_width: 0.06
    penrose_region_singularity_width: 0.14

###############################################################################
# Logging set-up
logging:
  # Enable or disable logging to Weights and Biases (WandB)
  log_wandb: false
  wandb_log_freq: 10

  # Whether to log interim results during training (best or scheduled). Setting
  # to false disables all file save logging
  log_interim: true

  # Directory where logs and other outputs will be saved
  log_dir: 'runs'

  # Setting log_interval to null disables scheduled logging (but allows for best
  # loss tracking), else log each `log_interim` epochs
  log_interval: null

  # Track the best loss as training evolves?
  track_best: true

  # Save the historical best losses? Setting to false overwrites the previous
  # best loss for the run
  save_best_hist: false

  # Log batches and model when numerical errors occur?
  log_errors: true

  # Whether to print a breakdown of individual loss terms with each training step
  print_batch_losses: false

###############################################################################
# Model-specific parameters
model_specific:
  # Set whether the spacetime is Lorentizian
  lorentzian: true

  # Use the global S^2-embedding architecture (single network, no atlas patches)
  embed: true

  # Scaling of the patch sample limits (1 indicates full patch)
  patch_width_R2: 0.85
  patch_width_S2: 1.0

  # The \alpha factor in the sampling Beta function
  # ...for R2: values < 1 => closer to boundaries, values > 1 => closer to origin
  # ...for S2: values < 1 => closer to extremeties, values > 1 => closer to radial midpoint
  density_power_R2: 1.1
  density_power_S2: 1.0

  # Optional density-power schedules. Set to null to keep the initial values fixed.
  # The same scheduler modes are supported as for loss multipliers, including step.
  # Move from a broad/central Penrose sample toward boundary-heavy samples.
  # The late phase gives more attention to singularity-side interior behaviour.
  density_power_R2_schedule:
    strategy: linear
    final_value: 0.65
    warmup_epochs: 0
    decay_rate: 0.96
    steps: 1
  density_power_S2_schedule: null
    # strategy: step
    # decay_rate: 0.5
    # steps: 1

  # Opt-in Penrose region curriculum.  Early training sees more exterior and
  # horizon points; late training remains global but spends more samples in the
  # difficult black/white-hole interior and singularity-side bands.
  use_penrose_region_curriculum: true
  penrose_region_exterior_start: 0.45
  penrose_region_interior_start: 0.30
  penrose_region_horizon_start: 0.20
  penrose_region_singularity_start: 0.05
  penrose_region_exterior_end: 0.20
  penrose_region_interior_end: 0.45
  penrose_region_horizon_end: 0.15
  penrose_region_singularity_end: 0.20
  penrose_region_horizon_width: 0.06
  penrose_region_singularity_width: 0.10

  # Multiplier for the Kretschmann loss
  kretschmann_multiplier: 3.5

  # Multiplier for the speciality-index S=1 type-D loss (0 = disabled).
  # This Schwarzschild trial is constrained by Einstein + Kretschmann + R2Det
  # and explicit SO(3) Killing symmetry.
  speciality_index_multiplier: 0.0
  killing_symmetry_multiplier: 1.0
  k_repeller_multiplier: 0.0
  speciality_index_rprofile_multiplier: 0.0

  # Weight each per-sample loss norm by sqrt(abs(det(g))) as the volume element.
  use_volume_scaling: true
  # Legacy alias retained for older scripts/configs.
  use_area_measure_weight: true

  # Contract tensor/vector loss norms with the inverse metric.
  use_metric_contraction: true
  volume_scaling_loss_components:
    einstein: true
    kretschmann: true
    r2_det: true
    speciality_index: true
    killing_symmetry: true
    k_repeller: true
    speciality_index_rprofile: true
  metric_contraction_loss_components:
    # Scalar invariant/barrier losses do not have tensor indices to contract.
    einstein: true
    kretschmann: false
    r2_det: false
    speciality_index: false
    killing_symmetry: true
    k_repeller: false
    speciality_index_rprofile: true

  # Ricci/Kretschmann computation: "standard" (reverse-mode, slower) or "optimised"  (forward-mode, faster)
  ricci_kernel: optimised

  # Multiplier for the R2 determinant finiteness barrier loss (0 = disabled)
  r2_det_loss_multiplier: 0.075

  # Schwarzschild mass parameter
  m: 1.0

###############################################################################
# Visualisation parameters
visualisation:
  visualise: true
  num_samples: 1000
  patch_width_R2: 0.8
  patch_width_S2: 1.0
  # ...the \alpha (>0) value in the beta
  # function, values < 1 skew to boundary, >1
  # skew to centre
  density_power_R2: 0.8
  # ...the \alpha (>0) value in the beta
  # function, values < 1 skew to extremeties,
  # >1 skew to radial midpoint
  density_power_S2: 1.0
