###############################################################################
# Schwarzschild hyperparameters
###############################################################################

###############################################################################
# Geometry
geometry:
  dim: 4
  n_patches: 1
  einstein_constant: 0.0

###############################################################################
# Data
data:
  patch_width: null
  num_samples: 10000

###############################################################################
# Loss
loss:
  einstein_multiplier: 1.0

  einstein_schedule: null
  kretschmann_schedule: null
  r2_det_schedule: null
  speciality_index_schedule: null
  killing_symmetry_schedule: null
  k_repeller_schedule: null
  speciality_index_rprofile_schedule: null

###############################################################################
# Model
model:
  experiment: blackhole
  saved_model: false
  saved_model_path: null
  saved_model_weight_noise: 0.0
  n_hidden: 256
  n_layers: 6
  activations: gelu
  use_bias: true
  np_seed: 66
  tf_seed: 66
  dtype: float64

###############################################################################
# Training
training:
  epochs: 500
  batch_size: 5
  init_learning_rate: 0.0003
  min_learning_rate: 3.0e-06
  use_validation: false
  val_print: false
  num_val_samples: 500
  val_batch_size: 100
  verbosity: 1

###############################################################################
# Logging
logging:
  log_wandb: false
  wandb_log_freq: 10
  log_interim: true
  log_dir: runs
  log_interval: null
  track_best: true
  save_best_hist: false
  log_errors: true
  print_batch_losses: false

###############################################################################
# Model-specific
model_specific:
  lorentzian: true
  embed: true
  local_2d_mode: false
  local_2d_patch_width: null
  local_2d_density_power: null
  local_single_s2_patch: false
  local_s2_patch_idx: 0
  density_power_R2: 1.0
  density_power_R2_schedule: null
  density_power_S2: 1.0
  density_power_S2_schedule: null
  patch_width_R2: 0.85
  patch_width_S2: 1.0
  use_penrose_region_curriculum: false
  penrose_region_exterior_start: 0.55
  penrose_region_interior_start: 0.25
  penrose_region_horizon_start: 0.15
  penrose_region_singularity_start: 0.05
  penrose_region_exterior_end: 0.25
  penrose_region_interior_end: 0.55
  penrose_region_horizon_end: 0.15
  penrose_region_singularity_end: 0.05
  penrose_region_horizon_width: 0.06
  penrose_region_singularity_width: 0.1
  penrose_interior_only: false
  kretschmann_multiplier: 1.0
  r2_det_loss_multiplier: 0.075
  speciality_index_multiplier: 0.0
  killing_symmetry_multiplier: 1.0
  k_repeller_multiplier: 0.0
  k_repeller_epsilon: 0.0001
  speciality_index_rprofile_mode: profile
  speciality_index_rprofile_centre: 2.0
  speciality_index_rprofile_multiplier: 0.0
  speciality_index_rprofile_epsilon: 0.01
  m: 1.0
  use_volume_scaling: true
  use_area_measure_weight: false
  use_metric_contraction: true
  volume_scaling_loss_components:
    killing_symmetry: false
  metric_contraction_loss_components: null
  ricci_kernel: optimised
  einstein_loss_mode: curvature_normalized_capped
  curvature_norm_epsilon: 0.001
  curvature_norm_cap_kappa: 1.0
  kretschmann_loss_mode: weyl_invariant
  kretschmann_sqrt_epsilon: 1.0e-12
  weyl_invariant_norm: 0.0625
  det_barrier_mode: both_blocks

###############################################################################
# Visualisation
visualisation:
  visualise: false
  # num_samples: 4000
  num_samples: 40
  patch_width_R2: 0.8
  patch_width_S2: 1.0
  local_single_s2_patch: null
  local_s2_patch_idx: null
  density_power_R2: 1.0
  density_power_S2: 1.0

###############################################################################
# Training stages
training_stages: null
