###############################################################################
# Local Lorentzian hyperparameters
###############################################################################

###############################################################################
# Model
model:
  experiment: blackhole

  # Fresh local unsupervised model.
  saved_model: false
  saved_model_path: null
  saved_model_weight_noise: 0.0

  dtype: float64
  n_hidden: 128
  n_layers: 4
  activations: gelu
  use_bias: true

  # Sweep scripts set seeds per run.
  np_seed: null
  tf_seed: null

###############################################################################
# Geometry
geometry:
  dim: 2
  n_patches: 1
  einstein_constant: 0.0

  # Kept for base schema compatibility; local_2d_mode does not use overlap.
  overlap_upperwidth: 0.1

###############################################################################
# Data
data:
  # Keep high enough for stable local Einstein estimates.
  num_samples: 1000

###############################################################################
# Loss
loss:
  # Einstein-only local training.
  einstein_multiplier: 1.0
  overlap_multiplier: 0.0
  finiteness_multiplier: 0.0

  # Loss schedules. Null keeps each multiplier fixed at its base value.
  einstein_schedule: null
  overlap_schedule: null
  finiteness_schedule: null
  kretschmann_schedule: null
  r2_det_schedule: null
  killing_symmetry_schedule: null
  k_repeller_schedule: null
  speciality_index_rprofile_schedule: null
  horizon_anchor_schedule: null
  trapped_surface_schedule: null

###############################################################################
# Training
training:
  epochs: 100
  batch_size: 512

  init_learning_rate: 0.001
  min_learning_rate: 0.00002

  use_validation: false
  val_print: false
  num_val_samples: 2000
  val_batch_size: 256

  verbosity: 1

###############################################################################
# Logging
logging:
  log_wandb: false
  wandb_log_freq: 10

  log_interim: true
  log_dir: runs
  log_interval: null
  track_best: true
  save_best_hist: false
  log_errors: true
  print_batch_losses: false

###############################################################################
# Model-specific
model_specific:
  # Lorentzian signature with the existing indefinite-Cholesky pathway.
  lorentzian: true

  # Local 2D mode bypasses Schwarzschild embedding and Penrose sampling.
  local_2d_mode: true
  embed: false

  # S2 single-chart controls are inactive in local_2d_mode.
  local_single_s2_patch: false
  local_s2_patch_idx: 0

  # In local_2d_mode, patch_width_S2 is the active 2D patch width.
  patch_width_R2: 0.85
  patch_width_S2: 1.0

  # In local_2d_mode, density_power_S2 is the active 2D sampling control.
  density_power_R2: 1.0
  density_power_S2: 1.0

  # Keep non-Einstein Schwarzschild losses disabled.
  kretschmann_multiplier: 0.0
  r2_det_loss_multiplier: 0.0

  # Loss norm conventions.
  use_volume_scaling: true
  use_metric_contraction: true

  # Ricci kernel and mass field are kept for shared Schwarzschild config paths.
  ricci_kernel: optimised
  m: 1.0

###############################################################################
# Visualisation
visualisation:
  # Keep sweep runs lightweight; generate plots in post-processing.
  visualise: false
  num_samples: 4000
  patch_width_R2: 0.85
  patch_width_S2: 1.0
  density_power_R2: 1.0
  density_power_S2: 1.0

  # Null means inherit local chart settings from model_specific.
  local_single_s2_patch: null
  local_s2_patch_idx: null

###############################################################################
# Metadata
metadata:
  run_name: local_lorentzian
  run_id: null
  misc: {}
