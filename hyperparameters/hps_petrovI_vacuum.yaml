###############################################################################
# Petrov type-I vacuum search hyperparameters
###############################################################################

###############################################################################
# Geometry
geometry:
  dim: 4
  n_patches: 1
  einstein_constant: 0.0

###############################################################################
# Data
data:
  num_samples: 10000

###############################################################################
# Loss
loss:
  einstein_multiplier: 1.0

  einstein_schedule: null
  kretschmann_schedule: null
  r2_det_schedule: null
  killing_symmetry_schedule: null
  k_repeller_schedule: null
  speciality_index_rprofile_schedule: null
  horizon_anchor_schedule: null
  trapped_surface_schedule: null

###############################################################################
# Model
model:
  experiment: blackhole

  # Start from a stable Lorentzian embedding seed and perturb weights to move
  # away from the constant-S/type-D basin.
  saved_model: true
  saved_model_path: seed_models/IL_embed.keras
  saved_model_weight_noise: 0.01

  dtype: float64
  n_hidden: 128
  n_layers: 4
  activations: gelu
  use_bias: true

  np_seed: null
  tf_seed: null

###############################################################################
# Training
training:
  epochs: 500
  batch_size: 128
  init_learning_rate: 0.00005
  min_learning_rate: 0.000002
  use_validation: true
  val_print: false
  num_val_samples: 500
  val_batch_size: 100
  verbosity: 1

###############################################################################
# Logging
logging:
  log_wandb: false
  wandb_log_freq: 10
  log_interim: true
  log_dir: runs
  log_interval: null
  track_best: true
  save_best_hist: false
  log_errors: true
  print_batch_losses: false

###############################################################################
# Model-specific
model_specific:
  # Signature and architecture.
  lorentzian: true
  embed: true
  m: 1.0

  # Penrose R2 and stereographic S2 sampling controls.
  patch_width_R2: 0.85
  patch_width_S2: 1.0
  density_power_R2: 0.8
  density_power_S2: 1.0

  # Disable Schwarzschild profile matching and type-D/spherical constraints.
  kretschmann_multiplier: 0.0
  killing_symmetry_multiplier: 0.0

  # Bounded soft barrier against collapse to flat/type-O space.
  k_repeller_multiplier: 0.001
  k_repeller_epsilon: 0.0001

  # Fit S to a bounded non-constant profile with mean away from S=1.
  speciality_index_rprofile_mode: profile
  speciality_index_rprofile_centre: 2.0
  speciality_index_rprofile_multiplier: 0.05
  speciality_index_rprofile_epsilon: 0.000001

  # Guard against degenerate-metric collapse.
  r2_det_loss_multiplier: 0.001

  # Loss norm conventions.
  use_volume_scaling: true
  use_metric_contraction: true

  # Ricci/Kretschmann kernel: standard reverse-mode or optimised forward-mode.
  ricci_kernel: optimised

###############################################################################
# Visualisation
visualisation:
  visualise: true
  num_samples: 1000
  patch_width_R2: 0.8
  patch_width_S2: 1.0
  density_power_R2: 1.0
  density_power_S2: 1.0
  local_single_s2_patch: null
  local_s2_patch_idx: null

###############################################################################
# Metadata
metadata:
  run_name: petrovI_vacuum
  run_id: null
  misc: {}
